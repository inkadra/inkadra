# Inkadra report relay. Deployed by hand from .github/workflows/report-relay.yml, which also sets
# the secrets (GITHUB_TOKEN, TICKET_SECRET); nothing secret lives here.
name = "inkadra-report-relay"
main = "src/worker.js"
compatibility_date = "2026-09-01"
# Instances from before this domain still call the workers.dev address: keep it on for them.
workers_dev = true
routes = [{ pattern = "relay.inkadra.com", custom_domain = true }]

[vars]
REPO = "inkadra/inkadra-feedback"
# Reports a day for every installation together.
DAILY_LIMIT = "200"
# A network's share, a tenth of the day, so one network can't use it up for the others; IPv6 also
# counts by /48.
NETWORK_DAILY_LIMIT = "20"
# 300 MiB a day of attachments in the repository.
DAILY_BYTES = "314572800"
# A network's share of those bytes, 64 MiB: two of the largest reports.
NETWORK_DAILY_BYTES = "67108864"
# About a second on a phone, milliseconds on a PC: a speed bump, not a wall.
POW_BITS = "16"

# Used tickets, report counters and the daily total, in one SQLite-backed Durable Object.
[[durable_objects.bindings]]
name = "METER"
class_name = "Meter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Meter"]

# Per-network rate limit on /challenge and /report (the key is an HMAC of the client IP).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
