# Inkadra, all-in-one. Put it behind your reverse proxy (HTTPS) and set PUBLIC_URL in .env.
# The proxy must forward WebSocket upgrades on /collab. See docs/self-hosting.
#
# Variants, added with -f (see docs/self-hosting/README.md#compose-variants):
#   deploy/compose.split.yaml          web, collab and worker as separate containers
#   deploy/compose.s3.yaml             files in an S3-compatible bucket you already have
#   deploy/compose.rustfs.yaml         files in a bundled S3-compatible store (RustFS)
#   deploy/compose.vaapi.yaml          hardware video encoding on Intel or AMD GPUs (included in the standard image)
#   deploy/compose.nvidia.yaml         hardware video encoding on NVIDIA GPUs (included in the standard image)
#   deploy/proxy/<name>/compose.yaml   a reverse proxy in the same stack: caddy, traefik, nginx
#   deploy/compose.postgres-old-layout.yaml   stay on PostgreSQL 16 for now (docs/self-hosting/upgrades.md)
#   deploy/compose.demo.yaml           a public demo behind a Cloudflare Tunnel (docs/demo.md)

name: inkadra

services:
  inkadra:
    image: ${INKADRA_IMAGE:-ghcr.io/inkadra/inkadra}:${INKADRA_TAG:-latest}
    command: all
    restart: unless-stopped
    # Time to save open boards at shutdown (a board the database cannot take within a few seconds
    # is kept on disk instead); Docker's default 10 s kills the process sooner on a slow database.
    stop_grace_period: 30s
    ports:
      # Only this machine can reach the port: point your reverse proxy at it, or set
      # INKADRA_BIND=0.0.0.0 if the proxy runs on another host (see docs/self-hosting).
      - "${INKADRA_BIND:-127.0.0.1}:${INKADRA_PORT:-3000}:3000"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_SECRET_PREVIOUS: ${AUTH_SECRET_PREVIOUS:-}
      DATABASE_URL: postgres://inkadra:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/inkadra
      # With VALKEY_PASSWORD set (recommended, hex only: `openssl rand -hex 32`), Valkey asks for it.
      REDIS_URL: redis://${VALKEY_PASSWORD:+:${VALKEY_PASSWORD}@}valkey:6379
      INSTANCE_NAME: ${INSTANCE_NAME:-Inkadra}
      REGISTRATION: ${REGISTRATION:-invite}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Set it to your proxy's address only (docs/self-hosting/configuration.md#trust_proxy); the
      # bundled proxies in deploy/proxy set their own.
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      FEEDBACK_GITHUB_TOKEN: ${FEEDBACK_GITHUB_TOKEN:-}
      # A single dash on purpose: an empty value must stay empty, it turns the relay off.
      FEEDBACK_RELAY_URL: ${FEEDBACK_RELAY_URL-https://relay.inkadra.com}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-20GB}
      # Storage limits (decision 0081): empty leaves them to Settings → Storage.
      STORAGE_LIMIT: ${STORAGE_LIMIT:-}
      STORAGE_LIMIT_PER_USER: ${STORAGE_LIMIT_PER_USER:-}
      HEIC_PREVIEWS: ${HEIC_PREVIEWS:-true}
      RAW_PREVIEWS: ${RAW_PREVIEWS:-true}
      PDF_PREVIEWS: ${PDF_PREVIEWS:-true}
      VIDEO_PROXIES: ${VIDEO_PROXIES:-true}
      # Shooting days move to each project's Production board at start (decision 0123): true or false only
      PRODUCTION_BOARD_MOVE: ${PRODUCTION_BOARD_MOVE:-true}
      # Map pictures of map cards and GPX files (decision 0053)
      MAPS: ${MAPS:-true}
      MAP_TILE_URL: ${MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      MAP_SATELLITE_TILE_URL: ${MAP_SATELLITE_TILE_URL:-}
      MAP_SATELLITE_TILE_ATTRIBUTION: ${MAP_SATELLITE_TILE_ATTRIBUTION:-Satellite}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-© OpenStreetMap contributors}
      MAP_GEOCODER_URL: ${MAP_GEOCODER_URL:-}
      # Hardware encoding of playable copies: deploy/compose.vaapi.yaml, deploy/compose.nvidia.yaml
      VIDEO_PROXY_HWACCEL: ${VIDEO_PROXY_HWACCEL:-auto}
      VIDEO_PROXY_VAAPI_DEVICE: ${VIDEO_PROXY_VAAPI_DEVICE:-/dev/dri/renderD128}
      # Sign-in with Google, an OIDC provider, email (see docs/self-hosting/sign-in.md)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-false}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      CLIPPER_EXTENSION_IDS: ${CLIPPER_EXTENSION_IDS:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      # Browser policies (see docs/self-hosting/configuration.md#browser-security-headers)
      CSP_ENFORCE: ${CSP_ENFORCE:-true}
      # CSP_REPORT_URI is not forwarded by default: 0.4.0 refuses an empty value. To collect
      # reports, add `CSP_REPORT_URI: ${CSP_REPORT_URI}` here together with a value in .env.
      # Sent only on HTTPS requests when PUBLIC_URL is https, never on a plain-HTTP LAN address.
      HSTS_ENABLED: ${HSTS_ENABLED:-true}
    volumes:
      # A named volume by default. Set INKADRA_DATA to a host folder to keep uploads on a disk
      # or dataset of your choice: at startup it is given to uid 1000, the user Inkadra runs as.
      - ${INKADRA_DATA:-inkadra-data}:/data
    read_only: true
    tmpfs:
      - /tmp
    # The entrypoint starts as root only to give /data to uid 1000 when needed, then switches
    # to that user, which drops these capabilities too. Remove user and cap_add to start as
    # uid 1000 directly: the data folder must then already belong to it.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    networks: [default, backend]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inkadra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: inkadra
    volumes:
      # PostgreSQL 18 keeps its cluster in /var/lib/postgresql/18/docker, so the volume is the
      # parent folder. An existing `postgres-data` from PostgreSQL 16 has its cluster at the
      # top and is refused below until it is moved over
      # (docs/self-hosting/upgrades.md#upgrading-to-postgresql-18).
      # A host folder here must be owned by uid 70, the postgres user of the alpine image.
      - ${POSTGRES_DATA:-postgres-data}:/var/lib/postgresql
    # A cluster of PostgreSQL 16 or older mounted here (its PG_VERSION would sit right in the
    # volume) must not be answered with an empty database next to it: stop and say what to do.
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /var/lib/postgresql/PG_VERSION ]; then
          echo "The volume holds a PostgreSQL $$(cat /var/lib/postgresql/PG_VERSION) database from an older layout." >&2
          echo "Move it to PostgreSQL 18 first: docs/self-hosting/upgrades.md#upgrading-to-postgresql-18" >&2
          exit 1
        fi
        exec docker-entrypoint.sh "$$@"
      - --
    command: ["postgres"] # a custom entrypoint drops the image's default command
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkadra -d inkadra"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    # The password, when set, goes in as configuration on standard input ("-"), never on the
    # command line, so no process list shows it. Without it Valkey starts as before. Through
    # the image's entrypoint, which gives /data to the valkey user and drops root.
    command:
      - sh
      - -c
      - |
        [ -z "$$VALKEY_PASSWORD" ] && exec docker-entrypoint.sh valkey-server --appendonly yes
        exec docker-entrypoint.sh valkey-server - --appendonly yes <<EOF
        requirepass $$VALKEY_PASSWORD
        EOF
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
    volumes:
      - ${VALKEY_DATA:-valkey-data}:/data
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    healthcheck:
      # valkey-cli reads the password from REDISCLI_AUTH, not from its arguments.
      test:
        - CMD-SHELL
        - '[ -z "$$VALKEY_PASSWORD" ] || export REDISCLI_AUTH="$$VALKEY_PASSWORD"; valkey-cli ping | grep -q PONG'
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  # Inkadra, its database and Valkey. Nothing else joins it (the bundled proxies stay on
  # `default`), and it has no way out to the internet.
  backend:
    internal: true

volumes:
  inkadra-data:
  postgres-data:
  # Only for moving a PostgreSQL 16 install: POSTGRES_DATA=postgres18-data (see the guide).
  postgres18-data:
  valkey-data:
