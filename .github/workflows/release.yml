name: Release

# Tags main and opens a draft GitHub release. Tags pushed with the workflow token do not trigger
# other workflows, so this one starts CI on the new tag, which publishes the image and then the
# release: instances never see a version whose image is missing (#836).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.1.0 or 0.2.0-rc.1"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # the next steps push the tag
      - name: Check the version
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "Not a semver version: $VERSION"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "v$VERSION already exists"; exit 1; fi
          # The notes are the body of the release and of every instance's Updates page (#851).
          [ -f "docs/releases/$VERSION.en.md" ] || [ -f "docs/releases/${VERSION%%-*}.en.md" ] ||
            { echo "No docs/releases/${VERSION%%-*}.en.md: write the release notes first (docs/releases/CHECKLIST.md)"; exit 1; }
      # Only a commit whose CI passed on main is tagged; rerun CI there if it failed by chance.
      - name: Check that CI passed on this commit
        run: |
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch main --event push --status success --json databaseId --jq length)
          [ "$passed" -gt 0 ] || { echo "CI has not passed on main at $GITHUB_SHA: wait for it or rerun it"; exit 1; }
      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Inkadra $VERSION"
          git push origin "v$VERSION"
      # The hand-written notes (docs/releases/<version>.<lang>.md, or those of X.Y.Z for an
      # X.Y.Z-rc.N) are the body, in English, and the release-notes.<lang>.md assets that the
      # Updates page of every instance reads in its reader's language (decision 0080).
      # A draft: the release job of CI publishes it once the image is out.
      - name: GitHub release
        run: |
          args=(--title "Inkadra $VERSION" --verify-tag --draft)
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          notes=""
          for v in "$VERSION" "${VERSION%%-*}"; do
            if [ -f "docs/releases/$v.en.md" ]; then notes="$v"; break; fi
          done
          files=()
          if [ -n "$notes" ]; then
            args+=(--notes-file "docs/releases/$notes.en.md")
            mkdir -p "$RUNNER_TEMP/notes"
            for f in "docs/releases/$notes".*.md; do
              lang="${f#"docs/releases/$notes."}"
              lang="${lang%.md}"
              echo "$lang" | grep -Eq '^[a-z]{2}$' || continue
              cp "$f" "$RUNNER_TEMP/notes/release-notes.$lang.md"
              files+=("$RUNNER_TEMP/notes/release-notes.$lang.md")
            done
          fi
          gh release create "v$VERSION" "${files[@]}" "${args[@]}"
      - name: Build and publish the image
        run: gh workflow run ci.yml --ref "v$VERSION"
