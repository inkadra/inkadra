name: CodeQL

# Static analysis of the JavaScript and TypeScript sources (server, web app, packages, relay).
# Findings go to the repository's code scanning alerts; pull requests see the new ones.
on:
  pull_request:
  push:
    branches: [main]
  # Weekly on main, so new queries reach code that has not changed.
  schedule:
    - cron: "41 3 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build: CodeQL reads JavaScript and TypeScript from the sources.
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - '**/*.test.*'
              - '**/*.spec.*'
              - 'e2e/**'
              - 'relay/test/**'
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:javascript-typescript
