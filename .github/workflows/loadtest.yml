name: Load test

# The `medium` preset of the load test (#902) against the image of this commit, with Postgres
# and Valkey, in `all` and in split mode (web + collab + worker). Too slow for every pull
# request: nightly on main, on demand, and on pull requests that change the load test itself.
# A red night opens an issue, like a red main in ci.yml. See docs/self-hosting/capacity.md.
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - apps/server/scripts/loadtest/**
      - apps/server/src/loadtest/**
      - .github/workflows/loadtest.yml

permissions:
  contents: read

concurrency:
  group: loadtest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  loadtest:
    name: Load test (medium, ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [all, split]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # zizmor: ignore[cache-poisoning] publishes nothing
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:loadtest
          build-args: |
            VERSION=0.0.0-loadtest
            REVISION=${{ github.sha }}
          load: true
          # The layers ci.yml's image job keeps; this workflow only reads them.
          cache-from: type=gha,scope=image-amd64 # zizmor: ignore[cache-poisoning] publishes nothing
      - name: Start Inkadra (${{ matrix.mode }})
        env:
          MODE: ${{ matrix.mode }}
        run: |
          {
            echo "PUBLIC_URL=http://localhost:3000"
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "METRICS_TOKEN=$(openssl rand -hex 32)"
            echo "INKADRA_TAG=loadtest"
            echo "REGISTRATION=open"
          } > "$RUNNER_TEMP/.env"
          files=compose.yaml
          [[ $MODE == split ]] && files=compose.yaml:deploy/compose.split.yaml
          # Read by every docker compose command of this job.
          echo "COMPOSE_FILE=$files" >> "$GITHUB_ENV"
          COMPOSE_FILE=$files docker compose --env-file "$RUNNER_TEMP/.env" up -d --quiet-pull --wait --wait-timeout 300
          # The first account of an instance is its administrator, and the last administrator
          # cannot be deleted: one exists before the load test makes its own.
          curl -fsS -o /dev/null -H 'Origin: http://localhost:3000' -H 'Content-Type: application/json' \
            --data "{\"name\":\"Admin\",\"email\":\"admin@example.com\",\"password\":\"$(openssl rand -hex 16)\"}" \
            http://localhost:3000/api/auth/sign-up/email
      - name: Run the medium preset
        env:
          MODE: ${{ matrix.mode }}
          INKADRA_LOADTEST_CONFIRM: "yes"
        run: |
          collab=()
          [[ $MODE == split ]] && collab=(--collab-url http://localhost:3001)
          METRICS_TOKEN=$(sed -n 's/^METRICS_TOKEN=//p' "$RUNNER_TEMP/.env") \
            pnpm loadtest --preset medium --url http://localhost:3000 "${collab[@]}" --out "loadtest-$MODE"
      - name: Server logs
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/.env" logs --no-color > "loadtest-$MODE-server.log" 2>&1 || true
        env:
          MODE: ${{ matrix.mode }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: loadtest-${{ matrix.mode }}
          path: loadtest-${{ matrix.mode }}*
          if-no-files-found: warn
          retention-days: 30
      - name: Stop Inkadra
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/.env" down -v --remove-orphans || true

  red-night:
    name: Report a red night
    if: failure() && github.event_name == 'schedule'
    needs: loadtest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The nightly load test is red"
          body="The load test of $GITHUB_SHA failed: $RUN (reports in the artifacts)"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
