name: Wiki

# Publishes the user-facing pages of docs/ to the GitHub wiki (scripts/wiki-sync.mjs).
# The wiki must have one page created by hand first: GitHub makes its repository only then.
on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/wiki-sync.mjs", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    name: Publish the wiki
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # pushes to the wiki repository
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate and push
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.wiki.git" wiki
          node scripts/wiki-sync.mjs wiki
          cd wiki
          git add -A
          if git diff --cached --quiet; then echo "The wiki is up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Sync from ${GITHUB_SHA}"
          git push -q
