name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; the jobs that publish ask for more, one by one.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: postgres://inkadra:inkadra@localhost:5432/inkadra
  REDIS_URL: redis://localhost:6379
  IMAGE: ghcr.io/${{ github.repository }}

# Third-party actions are pinned to a commit; Dependabot keeps the pins and comments current.
jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inkadra
          POSTGRES_PASSWORD: inkadra
          POSTGRES_DB: inkadra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inkadra" --health-interval 5s --health-timeout 5s --health-retries 20
      # The tests of the queues (split mode) run against it, through REDIS_URL.
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # zizmor: ignore[cache-poisoning] publishes nothing; publish jobs use no cache
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm biome ci .
      - name: OpenAPI document is current
        run: pnpm --filter @inkadra/shared openapi:check
      - name: Migrations match the schema
        run: |
          pnpm --filter @inkadra/server db:generate --name ci-check
          git status --porcelain apps/server/drizzle | tee /tmp/drizzle-diff
          test ! -s /tmp/drizzle-diff || { echo "Schema changed without a migration: run pnpm db:generate"; exit 1; }
      - name: Types
        run: pnpm turbo run typecheck
      # The media worker tests skip what needs a tool the runner does not have.
      - name: Media tools of the -media image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libimage-exiftool-perl poppler-utils
      - name: Unit and integration tests
        run: pnpm turbo run test
      - name: Licences of production dependencies
        run: pnpm check:licenses

  # PostgreSQL 16 keeps working for one more release (deploy/compose.postgres16.yaml): the
  # suites that need a database run against it too. Remove with that file.
  server-postgres16:
    name: Server tests (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inkadra
          POSTGRES_PASSWORD: inkadra
          POSTGRES_DB: inkadra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inkadra" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # zizmor: ignore[cache-poisoning] publishes nothing; publish jobs use no cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter=@inkadra/server

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inkadra
          POSTGRES_PASSWORD: inkadra
          POSTGRES_DB: inkadra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inkadra" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # zizmor: ignore[cache-poisoning] publishes nothing; publish jobs use no cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm --filter @inkadra/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  perf:
    name: Canvas performance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inkadra
          POSTGRES_PASSWORD: inkadra
          POSTGRES_DB: inkadra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inkadra" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: suite
        name: Look for the performance suite
        run: |
          if [ -d e2e/tests/perf ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "No e2e/tests/perf yet: nothing to measure."; fi
      - if: steps.suite.outputs.present
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.suite.outputs.present
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # zizmor: ignore[cache-poisoning] publishes nothing; publish jobs use no cache
      - if: steps.suite.outputs.present
        run: pnpm install --frozen-lockfile
      - if: steps.suite.outputs.present
        run: pnpm turbo run build
      - if: steps.suite.outputs.present
        run: pnpm --filter @inkadra/e2e exec playwright install --with-deps chromium
      - if: steps.suite.outputs.present
        run: pnpm test:perf
      - if: always() && steps.suite.outputs.present
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canvas-performance
          path: |
            e2e/perf-results.json
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 30

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks on the history of this commit
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          # Only the history of the commit under test: other branches have their own runs.
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="HEAD" .

  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - name: zizmor (workflow security)
        env:
          ZIZMOR_VERSION: 1.31.1
          GH_TOKEN: ${{ github.token }}
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --persona=regular --min-severity=low .github/workflows

  # Builds the amd64 image once and hands it to the jobs that try it.
  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:ci
          build-args: |
            VERSION=0.0.0-ci
            REVISION=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # The `-media` variant: same image plus ffmpeg, exiftool and poppler. Checked here so a broken apt step or a
  # missing binary fails before main publishes it.
  image-media:
    name: Docker image (media)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:ci-media
          build-args: |
            VERSION=0.0.0-ci
            REVISION=${{ github.sha }}
            MEDIA=true
          load: true
      - name: Media tools run as the image user
        run: |
          docker run --rm --entrypoint ffmpeg "$IMAGE:ci-media" -hide_banner -version
          docker run --rm --entrypoint ffprobe "$IMAGE:ci-media" -hide_banner -version
          docker run --rm --entrypoint exiftool "$IMAGE:ci-media" -ver
          docker run --rm --entrypoint pdftoppm "$IMAGE:ci-media" -v
          docker run --rm --entrypoint prlimit "$IMAGE:ci-media" --version
          docker image ls "$IMAGE"
      # ffmpeg brings its own libraries (codecs, X11, Mesa…): scan them like the standard image.
      - name: Fail on critical vulnerabilities that have a fix
        env:
          GRYPE_VERSION: 0.121.0
          GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
        run: |
          curl -sSfLo grype.tar.gz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tar.gz" | sha256sum -c -
          tar xzf grype.tar.gz grype
          ./grype "docker:$IMAGE:ci-media" --only-fixed --fail-on critical

  proxy:
    name: Reverse proxy (${{ matrix.proxy }}, ${{ matrix.mode }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        proxy: [caddy, traefik, nginx]
        mode: [all, split]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"
      - name: Inkadra behind ${{ matrix.proxy }}
        env:
          INKADRA_TAG: ci
          PROXY: ${{ matrix.proxy }}
          MODE: ${{ matrix.mode }}
        run: scripts/test-proxy.sh "$PROXY" "$MODE"

  data-dir:
    name: Data folder owned by root
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"
      - name: Start on a root-owned bind mount
        env:
          INKADRA_TAG: ci
        run: scripts/test-data-dir.sh

  postgres-upgrade:
    name: PostgreSQL 16 to 18 (${{ matrix.mode }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [dump, in-place]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"
      - name: Seed on 16, upgrade as the guide says, check the data, roll back
        env:
          INKADRA_TAG: ci
          MODE: ${{ matrix.mode }}
        run: scripts/test-postgres-upgrade.sh "$MODE"

  scan:
    name: Image vulnerabilities (grype)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}
      - name: Fail on critical vulnerabilities that have a fix
        env:
          GRYPE_VERSION: 0.121.0
          GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
        run: |
          curl -sSfLo grype.tar.gz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tar.gz" | sha256sum -c -
          tar xzf grype.tar.gz grype
          ./grype "docker-archive:$RUNNER_TEMP/image.tar" --only-fixed --fail-on critical

  # main and tags only: build each architecture on its own runner (no emulation), push by
  # digest, then join them under the version tags.
  publish:
    name: Publish image (${{ matrix.variant }}, ${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs:
      [
        checks,
        server-postgres16,
        e2e,
        secrets,
        workflows,
        proxy,
        data-dir,
        postgres-upgrade,
        scan,
        image-media,
      ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # The organisation default for GITHUB_TOKEN is read-only: publishing needs this grant.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
        # `media` adds ffmpeg and is published with the `-media` tag suffix.
        variant: [standard, media]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Same list as in the manifest job: the first entry gives the version label.
          tags: |
            type=semver,pattern={{version}}
            type=edge,branch=main
          flavor: suffix=${{ matrix.variant == 'media' && '-media' || '' }},onlatest=true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            MEDIA=${{ matrix.variant == 'media' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          # No build cache: a published image is always built from a clean state.
          no-cache: true
      - name: Keep the digest for the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  manifest:
    name: Tag and attest image (${{ matrix.variant }})
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        variant: [standard, media]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.variant }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # X.Y.Z and X.Y for every version tag; `latest` for stable versions only;
          # `edge` for the latest build of main; sha-<short> for every published build.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=edge,branch=main
            type=sha,format=short
          flavor: suffix=${{ matrix.variant == 'media' && '-media' || '' }},onlatest=true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Create the multi-architecture tags
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(--tag "$tag"); done <<< "$TAGS"
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          first=$(head -n1 <<< "$TAGS")
          digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$first"
      - name: Attest where the image comes from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package the deployment files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p "dist/inkadra-$VERSION"
          cp -r compose.yaml .env.example deploy "dist/inkadra-$VERSION/"
          # The files pin this release instead of `latest`.
          sed -i "s/^# INKADRA_TAG=latest /INKADRA_TAG=$VERSION /" "dist/inkadra-$VERSION/.env.example"
          tar -C dist -czf "dist/inkadra-$VERSION-deploy.tar.gz" "inkadra-$VERSION"
          (cd dist && sha256sum "inkadra-$VERSION-deploy.tar.gz" > "inkadra-$VERSION-deploy.tar.gz.sha256")
      # The Release workflow creates the release and its notes; a tag pushed by hand gets one here.
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          cat > image.md <<EOF
          Image: \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\` (linux/amd64, linux/arm64), or \`:${VERSION}-media\` with ffmpeg for video posters.
          Verify it with \`gh attestation verify oci://ghcr.io/${GITHUB_REPOSITORY}:${VERSION} --repo ${GITHUB_REPOSITORY}\`.
          Install and upgrade: [docs/self-hosting](https://github.com/${GITHUB_REPOSITORY}/tree/${TAG}/docs/self-hosting).
          EOF
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=()
            case "$TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" --verify-tag --title "Inkadra $VERSION" --generate-notes "${flags[@]}"
          fi
          gh release view "$TAG" --json body --jq .body > notes.md
          if ! grep -q 'gh attestation verify' notes.md; then
            { cat image.md; echo; cat notes.md; } > release.md
            gh release edit "$TAG" --notes-file release.md
          fi
          gh release upload "$TAG" --clobber \
            "dist/inkadra-$VERSION-deploy.tar.gz" "dist/inkadra-$VERSION-deploy.tar.gz.sha256"
