name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  # A merge queue tests the merged result before it lands (#842).
  merge_group:
  # Every night on main: the e2e specs dealt to other shards (#857) and a longer collaboration
  # simulation (#854). A red night opens an issue, like a red push.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# Read-only by default; the jobs that publish ask for more, one by one.
permissions:
  contents: read

# A pull request keeps only its newest run. Every commit of main and every tag gets its own group:
# one group per branch made GitHub drop the pending run of a commit when the next one queued (#842).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}-{2}', github.event_name, github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: postgres://inkadra:inkadra@localhost:5432/inkadra
  REDIS_URL: redis://localhost:6379
  IMAGE: ghcr.io/${{ github.repository }}

# Third-party actions are pinned to a commit; Dependabot keeps the pins and comments current.
jobs:
  # The server's suite runs in its own job (server): only it needs a database and media tools.
  checks:
    name: Lint, types, package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD^1 is the commit this one builds on: main, for the merge commit of a pull request.
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # zizmor: ignore[cache-poisoning] publishes nothing; publish jobs use no cache
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm biome ci .
      - name: OpenAPI document is current
        run: pnpm --filter @inkadra/shared openapi:check
      # Installed apps and API clients (#845): accepted breaks are listed in scripts/contract-breaks.json.
      - name: The API keeps the contract of the last release
        # bash with pipefail: listing the tags must not fail silently and skip the comparison.
        shell: bash
        run: |
          # On a stable release tag, the release before it: its accepted lines are not stale yet.
          tag=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' | node scripts/contract-check.mjs base-tag "$GITHUB_REF")
          if [ -z "$tag" ]; then
            node scripts/contract-check.mjs openapi none packages/shared/openapi.json
            exit 0
          fi
          echo "Comparing with $tag"
          git fetch --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          git show "$tag:packages/shared/openapi.json" > "$RUNNER_TEMP/released-openapi.json"
          node scripts/contract-check.mjs openapi "$RUNNER_TEMP/released-openapi.json" packages/shared/openapi.json
      - name: Packages keep the names they export
        run: node scripts/contract-check.mjs packages HEAD^1
      - name: Migrations match the schema
        run: |
          pnpm --filter @inkadra/server db:generate --name ci-check
          git status --porcelain apps/server/drizzle | tee /tmp/drizzle-diff
          test ! -s /tmp/drizzle-diff || { echo "Schema changed without a migration: run pnpm db:generate"; exit 1; }
      - name: Types
        run: pnpm turbo run typecheck
      - name: Unit tests
        run: pnpm turbo run test --filter='!@inkadra/server'
      # Coverage of every workspace but the server, which the server-coverage job measures (#852).
      # Measuring slows timed tests down: the step above decides whether the tests pass.
      - name: Coverage
        run: >-
          pnpm turbo run test --continue --filter='!@inkadra/server' --
          --coverage.enabled --coverage.include='src/**' --coverage.reportOnFailure
          --coverage.reporter=json-summary --coverage.reporter=text-summary
          || echo "::warning::A test failed while coverage was measured; Unit tests decides."
      - name: Coverage stays above its floors
        run: node scripts/coverage-check.mjs apps/web apps/clipper packages/*
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            apps/*/coverage/coverage-summary.json
            packages/*/coverage/coverage-summary.json
          retention-days: 7
      - name: Licences of production dependencies
        run: pnpm check:licenses
      - name: Script tests
        run: node --test scripts/*.test.mjs

  # PostgreSQL 16 keeps working for one more release (deploy/compose.postgres16.yaml): the
  # suites that need a database run against it too. Remove 16 with that file.
  server:
    name: Server tests (PostgreSQL ${{ matrix.postgres }}, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    # The nightly run simulates collaboration for five minutes instead of thirty seconds.
    timeout-minutes: ${{ github.event_name == 'schedule' && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        postgres: [18, 16]
        shard: [1, 2]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: inkadra
          POSTGRES_PASSWORD: inkadra
          POSTGRES_DB: inkadra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inkadra" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # zizmor: ignore[cache-poisoning] publishes nothing; publish jobs use no cache
      - run: pnpm install --frozen-lockfile
      # The media worker tests skip what needs a tool the runner does not have: run them once.
      # The packages the end-to-end shards keep; this job only reads them.
      - if: matrix.postgres == 18
        run: sudo chown "$USER" /var/cache/apt/archives
      - if: matrix.postgres == 18
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-e2e-ubuntu-24.04-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: apt-e2e-ubuntu-24.04-
      - name: Media tools of the standard image
        if: matrix.postgres == 18
        # The end-to-end shards run the same script.
        run: &media-tools |
          # The mirrors can stop resolving for many minutes, and then every index fetch waits 20 s:
          # first install offline, from the cached packages and the index the image ships.
          if sudo apt-get install -y -qq --no-install-recommends --no-download ffmpeg libimage-exiftool-perl poppler-utils; then
            echo "Installed from the cached packages, without the network."
            exit 0
          fi
          echo "The cache lacks some packages: updating the index."
          for attempt in 1 2 3; do
            # A failed or slow update keeps the old index; the install decides.
            rc=0
            sudo timeout -k 15 90 apt-get update -qq || echo "apt-get update failed (attempt $attempt, exit $?)."
            sudo timeout -k 15 180 apt-get install -y -qq --no-install-recommends ffmpeg libimage-exiftool-perl poppler-utils || rc=$?
            if [ "$rc" -eq 0 ]; then exit 0; fi
            echo "Media tools did not install (attempt $attempt, exit $rc)."
            if [ "$attempt" -lt 3 ]; then
              sudo timeout -k 15 120 dpkg --configure -a || true
              sleep 15
            fi
          done
          exit 1
      # The bucket suites (storage contract, resumable uploads, backups) against RustFS, the S3
      # server of deploy/compose.rustfs.yaml (#844).
      - name: S3 server
        if: matrix.postgres == 18
        run: |
          image=$(grep -o 'rustfs/rustfs:[^ ]*' deploy/compose.rustfs.yaml)
          docker run -d --name rustfs -p 9000:9000 --tmpfs /data:uid=10001,gid=10001 -e RUSTFS_VOLUMES=/data \
            -e "RUSTFS_ACCESS_KEY=$S3_TEST_ACCESS_KEY_ID" -e "RUSTFS_SECRET_KEY=$S3_TEST_SECRET_ACCESS_KEY" "$image"
          # /health answers before the S3 API does (503 for a few seconds): both wait, at most a minute.
          curl -fsS --retry 60 --retry-delay 1 --retry-all-errors -o /dev/null http://127.0.0.1:9000/health
          curl -fsS --retry 60 --retry-delay 1 --retry-all-errors -X PUT --aws-sigv4 aws:amz:us-east-1:s3 \
            --user "$S3_TEST_ACCESS_KEY_ID:$S3_TEST_SECRET_ACCESS_KEY" http://127.0.0.1:9000/inkadra
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_ACCESS_KEY_ID: inkadra-ci
          S3_TEST_SECRET_ACCESS_KEY: inkadra-ci-secret
      # PostgreSQL 18 measures coverage; the server-coverage job merges the two shards (#852).
      - run: |
          # shellcheck disable=SC2086 # COVERAGE holds several arguments
          pnpm turbo run test --filter=@inkadra/server -- "--shard=$SHARD/2" $COVERAGE
        env:
          SHARD: ${{ matrix.shard }}
          COVERAGE: ${{ matrix.postgres == 18 && '--reporter=default --reporter=blob --coverage.enabled --coverage.include=src/**' || '' }}
          # A missing variable or tool fails the run instead of skipping suites (#855).
          INKADRA_TEST_MEDIA_TOOLS: ${{ matrix.postgres == 18 && 'required' || '' }}
          INKADRA_TEST_S3: ${{ matrix.postgres == 18 && 'required' || '' }}
          # Measured runs leave the timed assertions to the PostgreSQL 16 shards.
          INKADRA_COVERAGE: ${{ matrix.postgres == 18 && '1' || '' }}
          COLLAB_SIM_DURATION_MS: ${{ github.event_name == 'schedule' && '300000' || '' }}
          S3_TEST_ENDPOINT: ${{ matrix.postgres == 18 && 'http://127.0.0.1:9000' || '' }}
          S3_TEST_ACCESS_KEY_ID: inkadra-ci
          S3_TEST_SECRET_ACCESS_KEY: inkadra-ci-secret
      - if: matrix.postgres == 18
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-coverage-${{ matrix.shard }}
          path: apps/server/.vitest/blob/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The two PostgreSQL 18 shards measured their part: one report, held to its floor (#852).
  server-coverage:
    name: Server coverage
    needs: server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # zizmor: ignore[cache-poisoning] publishes nothing; publish jobs use no cache
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-coverage-*
          path: apps/server/.vitest/blob
          merge-multiple: true
      - name: Merge the shards
        working-directory: apps/server
        run: >-
          pnpm exec vitest --merge-reports=.vitest/blob --reporter=dot
          --coverage.enabled --coverage.include='src/**'
          --coverage.reporter=json-summary --coverage.reporter=text-summary
      - name: Coverage stays above its floor
        run: node scripts/coverage-check.mjs apps/server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-coverage
          path: apps/server/coverage/coverage-summary.json
          retention-days: 7

  # Dates where the local day and the UTC day differ (#848); the other jobs run in UTC.
  web-time-zones:
    name: Web unit tests (${{ matrix.tz }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tz: [Europe/Rome, Pacific/Auckland]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # zizmor: ignore[cache-poisoning] publishes nothing; publish jobs use no cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter=@inkadra/web
        env:
          TZ: ${{ matrix.tz }}

  # Its own workflow deploys it; the tests run here so that every pull request reports them (#854).
  relay:
    name: Report relay tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test

  # The check the ruleset of main requires: keep its name.
  tests:
    name: Lint, types, unit tests
    if: ${{ !cancelled() }}
    needs: [checks, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every suite passed
        env:
          CHECKS: ${{ needs.checks.result }}
          SERVER: ${{ needs.server.result }}
        run: test "$CHECKS" = success && test "$SERVER" = success

  # The suite runs on one worker, so it is split across runners, each with its own database.
  # Playwright repeats the first-run project (the administrator) in every shard.
  e2e-shard:
    name: End-to-end (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inkadra
          POSTGRES_PASSWORD: inkadra
          POSTGRES_DB: inkadra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inkadra" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # zizmor: ignore[cache-poisoning] publishes nothing; publish jobs use no cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      # The clipper's package for the Chrome Web Store. Every shard builds it, but an artifact name
      # is unique within a run: the first shard uploads it.
      - if: matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inkadra-clipper
          path: apps/clipper/release/*.zip
          if-no-files-found: error
          retention-days: 7
      # A mirror can crawl for many minutes, and every shard would wait for it: keep the packages.
      # apt checks each cached file against its signed index, so a stale one is downloaded again.
      - name: Let the cache restore apt's downloads
        run: sudo chown "$USER" /var/cache/apt/archives
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] publishes nothing; apt checks the files
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-e2e-ubuntu-24.04-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: apt-e2e-ubuntu-24.04-
      # A slow mirror times out and is retried instead of crawling for a quarter of an hour.
      - name: Make apt give up on a stalled mirror
        run: &apt-timeouts |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts
      - name: Browsers and their system packages
        env:
          BROWSERS: chromium
        run: &playwright-install |
          read -ra list <<< "$BROWSERS"
          pnpm --filter @inkadra/e2e exec playwright install "${list[@]}"
          # Playwright's own apt-get has no time limit: a stalled mirror held jobs until their
          # timeout (#971). Run as root, timeout stops apt-get with it, and the next try goes on.
          playwright="$PWD/e2e/node_modules/.bin/playwright"
          for attempt in 1 2 3; do
            rc=0
            sudo env "PATH=$PATH" timeout -k 15 240 "$playwright" install-deps "${list[@]}" || rc=$?
            if [ "$rc" -eq 0 ]; then exit 0; fi
            echo "The browsers' system packages did not install (attempt $attempt, exit $rc)."
            if [ "$attempt" -lt 3 ]; then
              sudo timeout -k 15 120 dpkg --configure -a || true
              sleep 15
            fi
          done
          exit 1
      # media-cards.spec.ts checks page counts, codecs and playable copies made by these.
      - name: Media tools of the standard image
        run: *media-tools
      - name: Run duration-balanced end-to-end shard
        run: |
          node scripts/e2e-shards.mjs "$SHARD" 6 > /tmp/e2e-files
          mapfile -t files < /tmp/e2e-files
          pnpm test:e2e "${files[@]}"
        env:
          SHARD: ${{ matrix.shard }}
          # At night the specs are dealt at random: one that needs another's data fails (#857).
          E2E_SHARD_SEED: ${{ github.event_name == 'schedule' && github.run_id || '' }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report
          retention-days: 7

  # The check the ruleset of main requires: keep its name.
  e2e:
    name: End-to-end (Playwright)
    if: ${{ !cancelled() }}
    needs: e2e-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: test "$RESULT" = success

  # A smoke subset in Firefox and WebKit, and the date-heavy specs in Los Angeles (#848), each on
  # its own database: the main suite stays in Chromium.
  e2e-browsers:
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox-smoke
            browsers: chromium firefox
          - project: webkit-smoke
            browsers: chromium webkit
          - project: dates-los-angeles
            browsers: chromium
          # Limits set by the environment, as on a managed server (#850).
          - project: managed-limits
            browsers: chromium
            storage-limit: 50GB
          # Password reset by email and OIDC sign-in, with a local mail sink and OpenID
          # provider (scripts in e2e/scripts) that only this job starts (audit F-20).
          - project: auth-providers
            browsers: chromium
            auth-providers: "1"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inkadra
          POSTGRES_PASSWORD: inkadra
          POSTGRES_DB: inkadra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inkadra" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # zizmor: ignore[cache-poisoning] publishes nothing; publish jobs use no cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: sudo chown "$USER" /var/cache/apt/archives
      # Chromium only: the packages the end-to-end shards keep; this job only reads them.
      - if: matrix.browsers == 'chromium'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-e2e-ubuntu-24.04-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: apt-e2e-ubuntu-24.04-
      # Another browser needs its own system packages (WebKit's GStreamer and codecs): keep them
      # under their own key, outside the shards' prefix, or every run downloads them again.
      - if: matrix.browsers != 'chromium'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] publishes nothing; apt checks the files
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-e2e-browsers-ubuntu-24.04-${{ matrix.browsers }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            apt-e2e-browsers-ubuntu-24.04-${{ matrix.browsers }}-
            apt-e2e-ubuntu-24.04-
      - name: Make apt give up on a stalled mirror
        run: *apt-timeouts
      - name: Browsers and their system packages
        env:
          BROWSERS: ${{ matrix.browsers }}
        run: *playwright-install
      - name: Media tools of the standard image
        run: *media-tools
      - env:
          PROJECT: ${{ matrix.project }}
          STORAGE_LIMIT: ${{ matrix.storage-limit }}
          STORAGE_LIMIT_PER_USER: ${{ matrix.storage-limit && '10GB' || '' }}
          E2E_AUTH_PROVIDERS: ${{ matrix.auth-providers }}
        run: pnpm --filter @inkadra/e2e exec playwright test "--project=$PROJECT"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: e2e/playwright-report
          retention-days: 7

  perf:
    name: Canvas performance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inkadra
          POSTGRES_PASSWORD: inkadra
          POSTGRES_DB: inkadra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inkadra" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: suite
        name: Look for the performance suite
        run: |
          if [ -d e2e/tests/perf ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "No e2e/tests/perf yet: nothing to measure."; fi
      - if: steps.suite.outputs.present
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.suite.outputs.present
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # zizmor: ignore[cache-poisoning] publishes nothing; publish jobs use no cache
      - if: steps.suite.outputs.present
        run: pnpm install --frozen-lockfile
      - if: steps.suite.outputs.present
        run: pnpm turbo run build
      # The packages the end-to-end shards keep; this job only reads them.
      - if: steps.suite.outputs.present
        run: sudo chown "$USER" /var/cache/apt/archives
      - if: steps.suite.outputs.present
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-e2e-ubuntu-24.04-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: apt-e2e-ubuntu-24.04-
      - if: steps.suite.outputs.present
        name: Make apt give up on a stalled mirror
        run: *apt-timeouts
      - if: steps.suite.outputs.present
        name: Browsers and their system packages
        env:
          BROWSERS: chromium
        run: *playwright-install
      - if: steps.suite.outputs.present
        run: pnpm test:perf
      - if: always() && steps.suite.outputs.present
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canvas-performance
          path: |
            e2e/perf-results.json
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 30

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks on the history of this commit
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 10 -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          # Only the history of the commit under test: other branches have their own runs.
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="HEAD" .

  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 10 -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - name: zizmor (workflow security)
        env:
          ZIZMOR_VERSION: 1.31.1
          GH_TOKEN: ${{ github.token }}
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --persona=regular --min-severity=low .github/workflows

  # Advisories in the production dependencies, by the rule grype applies to the image: high or
  # critical with a fix fails, so the fix is one lockfile bump away (Dependabot proposes it every
  # week). The nightly run checks main again, so a new advisory opens an issue (red-main) even
  # without a pull request. Accepted advisories: auditConfig.ignoreGhsas in pnpm-workspace.yaml.
  # Both commands read the lockfiles only; nothing is installed.
  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Workspace production dependencies (pnpm)
        run: pnpm audit --prod --audit-level high --ignore-unfixable
      - name: Report relay production dependencies (npm)
        working-directory: relay
        run: npm audit --omit=dev --audit-level=high

  # Builds the amd64 image once and hands it to the jobs that try it.
  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:ci
          build-args: |
            VERSION=0.0.0-ci
            REVISION=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          # Layers of earlier runs (#843): the dependency layer is rebuilt only with the lockfile.
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=max,ignore-error=true
      - run: docker load --input "$RUNNER_TEMP/image.tar"
      - name: Media tools run as the image user
        run: |
          docker run --rm --entrypoint ffmpeg "$IMAGE:ci" -hide_banner -version
          docker run --rm --entrypoint ffprobe "$IMAGE:ci" -hide_banner -version
          docker run --rm --entrypoint exiftool "$IMAGE:ci" -ver
          docker run --rm --entrypoint pdftoppm "$IMAGE:ci" -v
          docker run --rm --entrypoint prlimit "$IMAGE:ci" --version
          # Hardware encoding (#358): the encoders, the free VAAPI drivers and the Quick Sync runtime.
          docker run --rm --entrypoint sh "$IMAGE:ci" -c \
            'ffmpeg -hide_banner -encoders | grep -cE " h264_(nvenc|qsv|vaapi) " | grep -qx 3 &&
             ls /usr/lib/x86_64-linux-gnu/dri/iHD_drv_video.so /usr/lib/x86_64-linux-gnu/dri/radeonsi_drv_video.so &&
             ls /usr/lib/x86_64-linux-gnu/libmfx-gen.so.1.2* && command -v vainfo'
      # Media packages must not add setuid/setgid programs beyond the runtime base (#357).
      - name: No new setuid or setgid files
        run: |
          base="$(sed -n 's/^FROM \(node:.*\) AS node-base$/\1/p' Dockerfile)"
          docker pull "$base"
          privileged() {
            docker run --rm --user 0 --entrypoint find "$1" / -xdev -perm /6000 -type f | sort
          }
          privileged "$base" > base.txt
          privileged "$IMAGE:ci" > standard.txt
          diff -u base.txt standard.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # Both modes on one runner: loading the image costs as much as a test, and runners are shared.
  proxy:
    name: Reverse proxy (${{ matrix.proxy }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        proxy: [caddy, traefik, nginx]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"
      - name: Inkadra behind ${{ matrix.proxy }}
        env:
          INKADRA_TAG: ci
          PROXY: ${{ matrix.proxy }}
        run: |
          scripts/test-proxy.sh "$PROXY" all
          scripts/test-proxy.sh "$PROXY" split

  data-dir:
    name: Data folder owned by root
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"
      - name: Start on a root-owned bind mount
        env:
          INKADRA_TAG: ci
        run: scripts/test-data-dir.sh

  postgres-upgrade:
    name: PostgreSQL 16 to 18 (${{ matrix.mode }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [dump, in-place]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"
      - name: Seed on 16, upgrade as the guide says, check the data, roll back
        env:
          INKADRA_TAG: ci
          MODE: ${{ matrix.mode }}
        run: scripts/test-postgres-upgrade.sh "$MODE"

  # The last release with its sample data, upgraded to this image; its backup restored here;
  # and the rollback to it (#793, #792, #805).
  release-upgrade:
    name: Upgrade from the last release
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"
      - name: Seed on the release, upgrade, restore its backup, roll back
        env:
          GH_TOKEN: ${{ github.token }}
          INKADRA_TAG: ci
        run: |
          from=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName | ltrimstr("v")')
          INKADRA_FROM_TAG="$from" scripts/test-release-upgrade.sh

  scan:
    name: Image vulnerabilities (grype)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}
      - name: Fail on high or critical vulnerabilities that have a fix
        env:
          GRYPE_VERSION: 0.121.0
          GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
        run: |
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 10 -o grype.tar.gz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tar.gz" | sha256sum -c -
          tar xzf grype.tar.gz grype
          ./grype "docker-archive:$RUNNER_TEMP/image.tar" --only-fixed --fail-on high

  # main and tags only: build each architecture on its own runner (no emulation), push by
  # digest, then join them under the version tags. A digest has no tag yet, so nobody pulls it
  # until manifest: before that, this job starts and scans that very image (#835).
  # The one check that names every gate (#842): require it in the ruleset of main. It fails when any
  # gate failed, was cancelled or was skipped, so a new gate counts as soon as it is listed here.
  # Compose files and their overlays (#900): every combination must resolve, and the Office
  # worker must come out on the -office tag with its seccomp profile, Docker's default plus the
  # namespace calls.
  compose:
    name: Compose files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PUBLIC_URL: http://localhost:3000
      AUTH_SECRET: ci
      POSTGRES_PASSWORD: ci
      INKADRA_TAG: 0.9.0
      # compose.yaml hands this file to the container (env_file, decision 0131): the example, as
      # a release archive's .env starts from it.
      INKADRA_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every combination resolves
        run: |
          set -e
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f deploy/compose.split.yaml config -q
          docker compose -f compose.yaml -f deploy/compose.office.yaml config -q
          docker compose -f compose.yaml -f deploy/compose.split.yaml -f deploy/compose.office.yaml \
            -f deploy/compose.office.split.yaml config -q
          S3_ACCESS_KEY_ID=ci S3_SECRET_ACCESS_KEY=ci docker compose -f compose.yaml -f deploy/compose.rustfs.yaml config -q
      # With a bundled proxy, every Inkadra container is reached through it only, and believes it only.
      - name: Behind a bundled proxy, no Inkadra port is published
        env:
          INKADRA_DOMAIN: inkadra.example.com
        run: |
          set -e
          for proxy in caddy nginx traefik; do
            echo "== $proxy"
            docker compose -f compose.yaml -f "deploy/proxy/$proxy/compose.yaml" config --format json |
              jq -e '.services.inkadra.ports == null and .services.inkadra.environment.TRUST_PROXY == "10.212.47.2"'
            docker compose -f compose.yaml -f deploy/compose.split.yaml -f "deploy/proxy/$proxy/compose.yaml" \
              -f "deploy/proxy/$proxy/compose.split.yaml" config --format json |
              jq -e '([.services.inkadra, .services.collab, .services.worker] | all(.ports == null))
                and ([.services.inkadra, .services.collab] | all(.environment.TRUST_PROXY == "10.212.47.2"))'
          done
      # The worker overrides security_opt for its seccomp profile: no-new-privileges must survive.
      - name: The Office worker is on the -office image, with the base's restrictions
        run: |
          set -e
          docker compose -f compose.yaml -f deploy/compose.office.yaml config --format json > "$RUNNER_TEMP/office.json"
          jq -e '.services["office-worker"].image == "ghcr.io/inkadra/inkadra:0.9.0-office"
            and .services["office-worker"].command == ["worker"]
            and .services["office-worker"].environment.OFFICE_PREVIEWS == "true"
            and .services["office-worker"].user == "1000:1000"
            and .services["office-worker"].cap_drop == ["ALL"]
            and (.services["office-worker"].cap_add // []) == []
            and (.services["office-worker"].security_opt | index("no-new-privileges:true")) != null
            and (.services["office-worker"].security_opt | index("seccomp=./deploy/office-seccomp.json")) != null
            and .services.inkadra.environment.OFFICE_PREVIEWS == "true"
            and .services.inkadra.image == "ghcr.io/inkadra/inkadra:0.9.0"' "$RUNNER_TEMP/office.json"
      # The bundled object store sits with the database on the internal network, without
      # capabilities or a writable root, bounded like the services of compose.yaml; the bucket
      # job never puts the keys on curl's command line.
      - name: The bundled RustFS is locked down
        env:
          S3_ACCESS_KEY_ID: ci
          S3_SECRET_ACCESS_KEY: ci
        run: |
          set -e
          docker compose -f compose.yaml -f deploy/compose.rustfs.yaml config --format json > "$RUNNER_TEMP/rustfs.json"
          jq -e '.networks.backend.internal == true
            and ([.services.rustfs, .services["rustfs-bucket"]] | all(
              (.networks | keys) == ["backend"]
              and .cap_drop == ["ALL"] and (.cap_add // []) == []
              and .read_only == true
              and (.security_opt | index("no-new-privileges:true")) != null
              and (.ports // []) == []
              and .deploy.resources.limits.memory != null
              and .deploy.resources.limits.pids != null))
            and .services.rustfs.user == "10001:10001"
            and (.services["rustfs-bucket"].command | join(" ") | test("--user|-u ") | not)
            and (.services["rustfs-bucket"].command | join(" ") | test("curl -K - "))' "$RUNNER_TEMP/rustfs.json"
      - name: The seccomp profile is Docker's default plus the namespace calls
        run: |
          set -e
          curl -fsSL -o "$RUNNER_TEMP/default.json" \
            https://raw.githubusercontent.com/moby/profiles/7b5ccfab2d6b4e0aa64c6cce401a2705788eafeb/seccomp/default.json
          echo "15434cc9c9037d85b35027a60721bf45f381782b4283b01d94663366e71569f8  $RUNNER_TEMP/default.json" | sha256sum -c -
          jq '.syscalls += [{"names": ["clone", "clone3", "unshare", "setns", "mount", "umount2",
              "pivot_root", "sethostname", "setdomainname"], "action": "SCMP_ACT_ALLOW"}]' \
            "$RUNNER_TEMP/default.json" | diff - deploy/office-seccomp.json

  all:
    name: All checks
    if: always()
    needs:
      - tests
      - server-coverage
      - e2e
      - e2e-browsers
      - web-time-zones
      - relay
      - perf
      - secrets
      - audit
      - workflows
      - image
      - proxy
      - data-dir
      - compose
      - postgres-upgrade
      - release-upgrade
      - scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          test "$(jq '[.[] | select(.result != "success")] | length' <<< "$NEEDS")" = 0

  # A red main or a red night opens an issue, or adds to the open one (#842). The first attempt is
  # retried once by main-retry.yml (flaky tests, a stuck mirror): only a red retry is reported.
  red-main:
    name: Report a red main
    if: >-
      failure() && github.run_attempt > 1 && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule')
    needs: all
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # main's head, through the API
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          title="CI is red on main"
          # A push that main has moved past is no news: its successor reports for itself.
          if [ "$EVENT" = push ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            [ "$head" = "$GITHUB_SHA" ] || exit 0
          fi
          body="The $EVENT run of $GITHUB_SHA failed: $RUN"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --author app/github-actions \
            --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$number" ]; then gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi

  # A green main closes the open report, so the issue only stays open while main is red.
  green-main:
    name: Close the red-main report
    if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    needs: all
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # main's head, through the API
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          title="CI is red on main"
          # Only main's head speaks for main: an older commit's green retry closes nothing.
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [ "$head" = "$GITHUB_SHA" ] || exit 0
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --author app/github-actions \
            --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          [ -n "$number" ] || exit 0
          # A red night runs checks a push skips: once a night was reported, only a green night
          # closes the report. Only the reports count, not what people wrote on the issue.
          night=$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body,comments \
            --jq '[.body, (.comments[] | select(.author.login == "github-actions" or .author.login == "app/github-actions") | .body)] | any(startswith("The schedule run"))')
          if [ "$EVENT" = push ] && [ "$night" = true ]; then exit 0; fi
          gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Green again at $GITHUB_SHA: $RUN"

  publish:
    name: Publish image (${{ matrix.variant }}, ${{ matrix.arch }})
    # Not for pull requests, the merge queue or the nightly run. A manual run publishes only from
    # main or a version tag (the Release workflow starts one on its tag): from any other branch
    # it would push a sha-<commit> image with a valid attestation for code that never merged.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: all
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # The organisation default for GITHUB_TOKEN is read-only: publishing needs this grant.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
        # Both images include media tools; `office` adds LibreOffice for the Office preview worker (decision 0065), suffix `-office`.
        # The office variant has no PR build: LibreOffice makes it slow, and this job builds it.
        variant: [standard, office]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # A version tag publishes a version, and `latest`: only from a commit that is on main.
      - name: Refuse a tag whose commit is not on main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          # identical or behind: the commit is main's head or one of its ancestors.
          if [[ $status != identical && $status != behind ]]; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main ($status)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Same list as in the manifest job: the first entry gives the version label.
          tags: |
            type=semver,pattern={{version}}
            type=edge,branch=main
          flavor: suffix=${{ matrix.variant != 'standard' && format('-{0}', matrix.variant) || '' }},onlatest=true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            OFFICE=${{ matrix.variant == 'office' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          # No build cache: a published image is always built from a clean state.
          no-cache: true
      - name: Start the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" "$IMAGE:smoke"
          INKADRA_TAG=smoke scripts/test-data-dir.sh
      - name: Scan the pushed image for high or critical vulnerabilities that have a fix
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
          GRYPE_VERSION: 0.121.0
          GRYPE_SHA256_amd64: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
          GRYPE_SHA256_arm64: 86f570f75ca947ea3dd6486309232bcff6d78e44ba081ae75ab14eab72be3dae
        run: |
          sum="GRYPE_SHA256_$ARCH"
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 10 -o grype.tar.gz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_${ARCH}.tar.gz"
          echo "${!sum}  grype.tar.gz" | sha256sum -c -
          tar xzf grype.tar.gz grype
          ./grype "docker:$IMAGE@$DIGEST" --only-fixed --fail-on high
      - name: Keep the digest for the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  # Whether a pull request changes the Office sandbox or its check: then office-sandbox also runs
  # on it, against the published edge-office image. Nothing is built or pushed for it.
  office-scope:
    name: Office sandbox changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- .github/workflows/ci.yml scripts/test-office.sh \
            scripts/bwrap-apparmor.sh deploy/office-seccomp.json apps/server/src/media/office.ts \
            apps/server/src/media/seccomp.ts; then changed=false; else changed=true; fi
          echo "changed=$changed" | tee -a "$GITHUB_OUTPUT"

  # A real conversion in each pushed -office image before anything is tagged (#900): the server's
  # convertOffice under the worker's security options of deploy/compose.office.yaml. On main and
  # tags it reuses the images publish just built on both architectures (the variant has no PR
  # build: LibreOffice makes it slow); on a pull request that office-scope picks, the published
  # edge-office image. A separate job, so the dependency install that bundles convertOffice never
  # runs next to a token that can push packages.
  office-sandbox:
    name: Office conversion (${{ matrix.arch }})
    needs: [publish, office-scope]
    if: >-
      !cancelled()
      && (needs.publish.result == 'success' || needs.office-scope.outputs.changed == 'true')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      # Both architectures report, even when one fails.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Like the publish jobs: nothing restored from a cache feeds an image that gets tagged.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name != 'pull_request'
        with:
          name: digest-office-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Like a standard Ubuntu host: a runner that restricts unprivileged user namespaces gets
      # the profile that lets bwrap use them, which Ubuntu 24.04 does not ship (office.md).
      - name: Load Ubuntu's AppArmor profile for bwrap where the runner needs it
        run: scripts/bwrap-apparmor.sh
      - name: Convert a Word document in the image's sandbox
        env:
          # The script's image is $INKADRA_IMAGE:$INKADRA_TAG-office: this repository's, also in a fork.
          INKADRA_IMAGE: ${{ env.IMAGE }}
          INKADRA_TAG: smoke
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then source="$IMAGE:edge-office"
          else source="$IMAGE@sha256:$(ls "$RUNNER_TEMP/digests")"; fi
          docker pull "$source"
          docker tag "$source" "$IMAGE:smoke-office"
          scripts/test-office.sh

  manifest:
    name: Tag and attest image (${{ matrix.variant }})
    # Only images whose -office variant converted a document in its sandbox on both architectures
    # are tagged. The condition names the two results: office-sandbox also needs office-scope,
    # which is skipped outside pull requests, and a skipped ancestor would skip this job too.
    needs: [publish, office-sandbox]
    if: >-
      !cancelled()
      && needs.publish.result == 'success'
      && needs.office-sandbox.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        variant: [standard, office]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.variant }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      # A retried older commit may finish after a newer one: `edge` moves only for main's head.
      - id: head
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          echo "is_head=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # X.Y.Z and X.Y for every version tag; `latest` for stable versions only; `next` for
          # every version tag, stable or release candidate; `edge` for the latest build of main;
          # sha-<short> for every published build. Like `latest`, `next` follows the version
          # tagged last: shortcut, a patch of an older line would move it back; compare with the
          # newest tag if older lines get patches.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=next,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main,enable=${{ steps.head.outputs.is_head == 'true' }}
            type=sha,format=short
          flavor: suffix=${{ matrix.variant != 'standard' && format('-{0}', matrix.variant) || '' }},onlatest=true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Create the multi-architecture tags
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(--tag "$tag"); done <<< "$TAGS"
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          first=$(head -n1 <<< "$TAGS")
          digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$first"
      - name: Attest where the image comes from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package the deployment files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p "dist/inkadra-$VERSION"
          cp -r compose.yaml .env.example deploy "dist/inkadra-$VERSION/"
          # The files pin this release instead of `latest`, even without INKADRA_TAG in .env (#834).
          sed -i "s/^# INKADRA_TAG=latest /INKADRA_TAG=$VERSION /" "dist/inkadra-$VERSION/.env.example"
          sed -i "s/\${INKADRA_TAG:-latest}/\${INKADRA_TAG:-$VERSION}/" "dist/inkadra-$VERSION/compose.yaml"
          grep -qF ":\${INKADRA_TAG:-$VERSION}" "dist/inkadra-$VERSION/compose.yaml"
          tar -C dist -czf "dist/inkadra-$VERSION-deploy.tar.gz" "inkadra-$VERSION"
          (cd dist && sha256sum "inkadra-$VERSION-deploy.tar.gz" > "inkadra-$VERSION-deploy.tar.gz.sha256")
      # The Release workflow creates the release and its notes as a draft; a tag pushed by hand
      # gets one here. The last step publishes it, now that the image exists (#836).
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          cat > image.md <<EOF
          Image: \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\` (linux/amd64, linux/arm64) with media tools, or \`:${VERSION}-office\` for the Office preview worker.
          Verify it with \`gh attestation verify oci://ghcr.io/${GITHUB_REPOSITORY}:${VERSION} --repo ${GITHUB_REPOSITORY}\`.
          Install and upgrade: [docs/self-hosting](https://github.com/${GITHUB_REPOSITORY}/tree/${TAG}/docs/self-hosting).
          EOF
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=(--draft)
            case "$TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" --verify-tag --title "Inkadra $VERSION" --generate-notes "${flags[@]}"
          fi
          gh release view "$TAG" --json body --jq .body > notes.md
          if ! grep -q 'gh attestation verify' notes.md; then
            { cat image.md; echo; cat notes.md; } > release.md
            gh release edit "$TAG" --notes-file release.md
          fi
          gh release upload "$TAG" --clobber \
            "dist/inkadra-$VERSION-deploy.tar.gz" "dist/inkadra-$VERSION-deploy.tar.gz.sha256"
          gh release edit "$TAG" --draft=false
