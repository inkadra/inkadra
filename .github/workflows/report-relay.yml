# Deploys the report relay (relay/) to Cloudflare Workers. The app sends bug reports and requests
# to it; it opens the GitHub issues, so no GitHub credential ships in the app.
#
# Secrets of the `report-relay` environment:
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
#   FEEDBACK_GITHUB_TOKEN  fine-grained PAT on the feedback repository only: Issues + Contents, read & write
# Deployment is manual only (workflow_dispatch) and only from main, never on push or merge.
# The ticket-signing secret is generated on the first deploy and stays on Cloudflare.
#
# Secrets are given only to the steps that use them; wrangler is pinned in relay/package-lock.json
# and installed without install scripts; actions are pinned by commit.
name: Report relay

# Pull requests run the relay's tests in ci.yml (job "Report relay tests"), so they report on
# every pull request; this workflow tests again before it deploys.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

  deploy:
    needs: test
    # Only by hand, only from main, and through an environment an administrator can protect.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: report-relay
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm ci --ignore-scripts

      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$FEEDBACK_GITHUB_TOKEN" ]; then
            echo "::error::Relay not deployed: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and FEEDBACK_GITHUB_TOKEN to the report-relay environment."
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --no-install wrangler deploy | tee deploy.log

      - name: Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
        run: |
          printf '%s' "$FEEDBACK_GITHUB_TOKEN" | npx --no-install wrangler secret put GITHUB_TOKEN
          if ! npx --no-install wrangler secret list | jq -e '.[] | select(.name == "TICKET_SECRET")' > /dev/null; then
            openssl rand -hex 32 | tr -d '\n' | npx --no-install wrangler secret put TICKET_SECRET
          fi

      - name: Health check
        run: |
          url=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Relay: $url"
          echo "### Report relay: $url" >> "$GITHUB_STEP_SUMMARY"
          sleep 5
          curl -fsS "$url/health" | jq -e '.ok == true'
