version: 2
updates:
  # Workflows pin actions to commits: Dependabot moves the pin and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Images in compose.yaml and the deploy/ overlays (Postgres, Valkey, RustFS, proxies).
  - package-ecosystem: docker-compose
    directories: ["/", "/deploy", "/deploy/proxy/*"]
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
