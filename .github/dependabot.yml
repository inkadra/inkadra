version: 2
updates:
  # Workflows pin actions to commits: Dependabot moves the pin and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: ["/", "/relay"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Images in compose.yaml and the deploy/ overlays (Postgres, Valkey, RustFS, proxies).
  - package-ecosystem: docker-compose
    directories: ["/", "/deploy", "/deploy/proxy/*"]
    schedule:
      interval: weekly
    # A new major of PostgreSQL cannot read the data of the old one, and its image keeps the data
    # in another folder: a bare bump would start an empty database. It is moved by hand, with a
    # guide and the upgrade test (see docs/self-hosting/upgrades.md#upgrading-to-postgresql-19).
    # deploy/compose.postgres18.yaml stays on 18 by design.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns: ["*"]
