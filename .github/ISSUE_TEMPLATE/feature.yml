name: Idea
description: Suggest a feature or an improvement
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
  - type: textarea
    id: context
    attributes:
      label: How you work
      description: "Film, photography, agency, solo or team: it helps us weigh the idea."
