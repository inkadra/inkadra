packages:
  - apps/*
  - packages/*
  - e2e

allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  msgpackr-extract: false

overrides:
  postman-collection@4>lodash: 4.18.1
  postman-collection@4>uuid: ^11.1.1
  "@stoplight/prism-http-server>fast-xml-parser": ^5.12.0
  "@esbuild-kit/core-utils>esbuild": ^0.25.0

# Dev-only: prism (`pnpm mock`) mocks the repo's own openapi.json. The patched faker (10.5.0) drops the
# `faker.address` API that postman-collection 4 calls at load, so `pnpm mock` would crash (#784).
auditConfig:
  ignoreGhsas:
    - GHSA-qxc2-j82w-r537

patchedDependencies:
  "@pdf-lib/fontkit@1.1.1": patches/@pdf-lib__fontkit@1.1.1.patch
