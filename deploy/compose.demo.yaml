# The public demo (decision 0084, docs/demo.md): "Try the demo" sandboxes that go after an hour,
# hardened for a small VM (2 ARM cores, 12 GB of RAM) behind a Cloudflare Tunnel. No port is
# published: cloudflared reaches Inkadra on the stack's network. Use together with compose.yaml:
#   docker compose -f compose.yaml -f deploy/compose.demo.yaml up -d
# Set in .env, besides PUBLIC_URL, AUTH_SECRET and POSTGRES_PASSWORD:
#   CLOUDFLARE_TUNNEL_TOKEN   the token of the tunnel (Zero Trust → Networks → Tunnels)
#   VALKEY_PASSWORD           any long random string: `openssl rand -hex 32`
#   TURNSTILE_SITE_KEY, TURNSTILE_SECRET   the Turnstile widget of "Try the demo"
# Use the plain image: the -media and -office ones bring tools the demo turns off anyway.

services:
  inkadra:
    ports: !reset []
    environment:
      DEMO_MODE: "true"
      DEMO_TTL: ${DEMO_TTL:-1h}
      DEMO_STORAGE: ${DEMO_STORAGE:-100MB}
      DEMO_MAX_SANDBOXES: ${DEMO_MAX_SANDBOXES:-50}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      REDIS_URL: redis://:${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}@valkey:6379
      # The server forces these in demo mode too; here they say so to whoever reads the file.
      REGISTRATION: closed
      UPLOAD_MAX_SIZE: 10MB
      CSP_ENFORCE: "true"
      HSTS_ENABLED: "true"
      VIDEO_PROXIES: "false"
      RAW_PREVIEWS: "false"
      HEIC_PREVIEWS: "false"
      PDF_PREVIEWS: "false"
      MAPS: "false"
      SMTP_URL: ""
      FEEDBACK_RELAY_URL: ""
      FEEDBACK_GITHUB_TOKEN: ""
      # cloudflared is the only proxy, on this stack's private network.
      TRUST_PROXY: uniquelocal
    # Straight as the node user: a fresh named volume already belongs to it (from the image).
    # A host folder in INKADRA_DATA must be given to uid 1000 first: chown -R 1000:1000 <folder>
    user: "1000:1000"
    cap_add: !reset []
    tmpfs:
      - /tmp:size=256m,mode=1777
    pids_limit: 512
    deploy:
      resources:
        limits:
          cpus: "1.25"
          memory: 4g
    networks: [edge, backend]

  postgres:
    # As the postgres user of the image: a fresh named volume already belongs to it.
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop: [ALL]
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 2g
    networks: [backend]

  valkey:
    # The password comes from the environment, not the command line, so `ps` does not show it.
    # BullMQ needs noeviction: past maxmemory Valkey refuses writes instead of dropping jobs.
    command:
      - sh
      - -c
      - exec valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$$VALKEY_PASSWORD"
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
      # valkey-cli reads it, for the health check.
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    read_only: true
    cap_drop: [ALL]
    # The image's entrypoint gives /data to the valkey user, then drops to it.
    cap_add: [CHOWN, SETGID, SETUID]
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512m
    networks: [backend]

  cloudflared:
    # Pin a release you have checked (https://github.com/cloudflare/cloudflared/releases).
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-latest}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    # The image has no shell for a health check: Docker restarts it if it exits, and Cloudflare
    # shows the tunnel down in its dashboard.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    depends_on:
      inkadra:
        condition: service_healthy
    networks: [edge]

networks:
  # Out to the internet: cloudflared, and Inkadra for Turnstile and the update check.
  edge: {}
  # The database and Valkey reach nothing outside, and nothing outside reaches them.
  backend:
    internal: true
