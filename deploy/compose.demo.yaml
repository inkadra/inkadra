# The public demo (decision 0084, docs/demo.md): "Try the demo" sandboxes that go after an hour,
# hardened for a small machine behind a Cloudflare Tunnel. No port is
# published: cloudflared reaches Inkadra on the stack's network. Use together with compose.yaml:
#   docker compose -f compose.yaml -f deploy/compose.demo.yaml up -d
# Set in .env, besides PUBLIC_URL, AUTH_SECRET and POSTGRES_PASSWORD:
#   CLOUDFLARE_TUNNEL_TOKEN   the token of the tunnel (Zero Trust → Networks → Tunnels)
#   VALKEY_PASSWORD           any long random string: `openssl rand -hex 32`
#   TURNSTILE_SITE_KEY, TURNSTILE_SECRET   the Turnstile widget of "Try the demo"
# Use the standard image: the demo disables media previews and does not need LibreOffice.

services:
  inkadra:
    ports: !reset []
    environment:
      DEMO_MODE: "true"
      DEMO_TTL: ${DEMO_TTL:-1h}
      DEMO_STORAGE: ${DEMO_STORAGE:-100MB}
      DEMO_MAX_SANDBOXES: ${DEMO_MAX_SANDBOXES:-50}
      # Required: without them the demo refuses to start (decision 0084).
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?set TURNSTILE_SITE_KEY in .env}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:?set TURNSTILE_SECRET in .env}
      REDIS_URL: redis://:${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}@valkey:6379
      # The server forces these in demo mode too; here they say so to whoever reads the file.
      REGISTRATION: closed
      UPLOAD_MAX_SIZE: 10MB
      CSP_ENFORCE: "true"
      HSTS_ENABLED: "true"
      VIDEO_PROXIES: "false"
      RAW_PREVIEWS: "false"
      HEIC_PREVIEWS: "false"
      PDF_PREVIEWS: "false"
      MAPS: "false"
      SMTP_URL: ""
      FEEDBACK_RELAY_URL: ""
      FEEDBACK_GITHUB_TOKEN: ""
      # Only cloudflared, at its fixed address below, may say who the visitor is. Cloudflare
      # appends the address it saw (the one of CF-Connecting-IP) to X-Forwarded-For, and
      # Inkadra takes the last entry after the trusted hop: what a visitor writes in the header
      # is ignored, and nothing else on the network can claim to be a proxy.
      TRUST_PROXY: 172.31.250.2
    # Straight as the node user: a fresh named volume already belongs to it (from the image).
    # A host folder in INKADRA_DATA must be given to uid 1000 first: chown -R 1000:1000 <folder>
    user: "1000:1000"
    cap_add: !reset []
    tmpfs: !override
      - /tmp:size=256m,mode=1777
    deploy:
      resources:
        limits:
          pids: 512
          cpus: "1.25"
          memory: 4g
    # Only these two: not the `default` network of compose.yaml.
    networks: !override
      edge:
        # Fixed too: left to Docker, Inkadra can start first and take cloudflared's address.
        ipv4_address: 172.31.250.3
      backend: {}

  postgres:
    # As the postgres user of the image: a fresh named volume already belongs to it.
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          pids: 200
          cpus: "0.5"
          memory: 2g
    networks: [backend]

  valkey:
    # The password goes in as configuration on standard input ("-"), never on the command
    # line, so no process list shows it. BullMQ needs noeviction: past maxmemory Valkey refuses
    # writes instead of dropping jobs.
    command:
      - sh
      - -c
      - |
        exec valkey-server - --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction <<EOF
        requirepass $$VALKEY_PASSWORD
        EOF
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
      # valkey-cli reads it, for the health check.
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    # Straight as the valkey user of the image (999:1000), without any capability: a fresh
    # named volume already belongs to it. A host folder in VALKEY_DATA must be given to it.
    user: "999:1000"
    read_only: true
    cap_drop: [ALL]
    cap_add: !reset []
    deploy:
      resources:
        limits:
          pids: 64
          cpus: "0.25"
          memory: 512m
    networks: [backend]

  cloudflared:
    # A pinned release (2026.10.7, 30 October 2026): move it on after reading the notes at
    # https://github.com/cloudflare/cloudflared/releases.
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: unless-stopped
    # Rotated like the services of compose.yaml (#837).
    logging:
      driver: json-file
      options: { max-size: "${LOG_MAX_SIZE:-20m}", max-file: "${LOG_MAX_FILES:-5}" }
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    # The image has no shell for a health check: Docker restarts it if it exits, and Cloudflare
    # shows the tunnel down in its dashboard.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          pids: 64
          cpus: "0.25"
          memory: 256m
    depends_on:
      inkadra:
        condition: service_healthy
    networks:
      edge:
        # The one address TRUST_PROXY trusts.
        ipv4_address: 172.31.250.2

networks:
  # Out to the internet: cloudflared, and Inkadra for Turnstile and the update check. A fixed
  # subnet, for the fixed addresses of cloudflared and Inkadra; change them with TRUST_PROXY if it is
  # taken.
  edge:
    ipam:
      config:
        - subnet: 172.31.250.0/29
  # The database and Valkey reach nothing outside, and nothing outside reaches them.
  backend:
    internal: true
