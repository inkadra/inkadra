# Files in a bundled S3-compatible store (RustFS, Apache-2.0) instead of the data volume:
#   docker compose -f compose.yaml -f deploy/compose.rustfs.yaml up -d
# Set S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY in .env (any random values, they are only
# shared by Inkadra and RustFS). Nothing is published on the host: RustFS sits on the internal
# `backend` network of compose.yaml with the database, so only Inkadra reaches it and it has no
# way out to the internet.

services:
  inkadra:
    environment:
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-inkadra}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      rustfs-bucket:
        condition: service_completed_successfully

  rustfs:
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    restart: unless-stopped
    # Rotated like the services of compose.yaml (#837).
    logging:
      driver: json-file
      options: { max-size: "${LOG_MAX_SIZE:-20m}", max-file: "${LOG_MAX_FILES:-5}" }
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      RUSTFS_VOLUMES: /data
      # Logs go to standard output, rotated above, instead of files inside the container.
      RUSTFS_OBS_LOG_DIRECTORY: ""
    volumes:
      # A host folder here must be owned by uid 10001, the rustfs user of the image.
      - ${RUSTFS_DATA:-rustfs-data}:/data
    # The image runs as uid 10001 from the start and its entrypoint needs no privilege: no
    # capabilities, and nothing but /data and a small /tmp is writable.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: ${RUSTFS_MEM_LIMIT:-1g}
          cpus: ${RUSTFS_CPUS:-0}
          pids: ${RUSTFS_PIDS_LIMIT:-1024}
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the bucket once, then exits. curl signs the request itself (AWS SigV4) and reads the
  # keys from a configuration on standard input, so no process list shows them.
  rustfs-bucket:
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    restart: "no"
    environment:
      S3_BUCKET: ${S3_BUCKET:-inkadra}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        auth() {
          echo 'aws-sigv4 = "aws:amz:us-east-1:s3"'
          printf '%s:%s' "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" | sed 's/[\\"]/\\&/g; s/.*/user = "&"/'
        }
        url="http://rustfs:9000/$$S3_BUCKET"
        if auth | curl -K - -fs -o /dev/null -I "$$url"; then echo "bucket $$S3_BUCKET exists"; exit 0; fi
        auth | curl -K - -fsS -X PUT "$$url" && echo "bucket $$S3_BUCKET created"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 64m
          pids: 32
    networks: [backend]
    depends_on:
      rustfs:
        condition: service_healthy

volumes:
  rustfs-data:
