# Caddy in front of Inkadra, with automatic HTTPS:
#   docker compose -f compose.yaml -f deploy/proxy/caddy/compose.yaml up -d
# Needs INKADRA_DOMAIN in .env (the host of PUBLIC_URL) and ports 80 and 443 free.
# Split mode: add -f deploy/compose.split.yaml before this file and set
# INKADRA_COLLAB_UPSTREAM=collab:3001.

services:
  caddy:
    image: caddy:2.11-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    # Rotated like the services of compose.yaml (#837).
    logging:
      driver: json-file
      options: { max-size: "${LOG_MAX_SIZE:-20m}", max-file: "${LOG_MAX_FILES:-5}" }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      INKADRA_DOMAIN: ${INKADRA_DOMAIN:?set INKADRA_DOMAIN in .env}
      INKADRA_COLLAB_UPSTREAM: ${INKADRA_COLLAB_UPSTREAM:-inkadra:3000}
    volumes:
      # Paths are relative to the folder of compose.yaml.
      - ./deploy/proxy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - inkadra
    networks:
      default:
        # The one address TRUST_PROXY trusts below.
        ipv4_address: 10.212.47.2

  inkadra:
    # Reached through Caddy only.
    ports: !reset []
    environment:
      # Only Caddy may say who the client is, unless .env names another proxy.
      TRUST_PROXY: ${TRUST_PROXY:-10.212.47.2}

networks:
  # A fixed subnet, so the proxy has a fixed address that TRUST_PROXY can name. Containers
  # without a fixed address get one from the upper half. If Docker says the pool overlaps with
  # another network, pick a free subnet here and change the two addresses above.
  default:
    ipam:
      config:
        - subnet: 10.212.47.0/24
          gateway: 10.212.47.1
          ip_range: 10.212.47.128/25

volumes:
  caddy-data:
  caddy-config:
