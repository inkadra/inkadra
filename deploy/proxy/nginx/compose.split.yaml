# Split mode with Nginx: sends /collab to the collab container, which is then reached through
# Nginx only. Use after deploy/compose.split.yaml and deploy/proxy/nginx/compose.yaml:
#   docker compose -f compose.yaml -f deploy/compose.split.yaml \
#     -f deploy/proxy/nginx/compose.yaml -f deploy/proxy/nginx/compose.split.yaml up -d

services:
  nginx:
    environment:
      INKADRA_COLLAB_UPSTREAM: ${INKADRA_COLLAB_UPSTREAM:-collab:3001}

  collab:
    # Reached through Nginx only.
    ports: !reset []
    environment:
      # Only Nginx may say who the client is, unless .env names another proxy.
      TRUST_PROXY: ${TRUST_PROXY:-10.212.47.2}
