# Split mode with Traefik: sends /collab to the collab container. Use after
# deploy/compose.split.yaml and deploy/proxy/traefik/compose.yaml.

services:
  traefik:
    configs:
      - source: traefik-inkadra-collab
        target: /etc/traefik/dynamic/inkadra-collab.yaml

  collab:
    environment:
      # Only Traefik may say who the client is, unless .env names another proxy.
      TRUST_PROXY: ${TRUST_PROXY:-10.212.47.2}

configs:
  traefik-inkadra-collab:
    content: |
      http:
        routers:
          inkadra-collab:
            rule: "Host(`${INKADRA_DOMAIN:?set INKADRA_DOMAIN in .env}`) && PathPrefix(`/collab`)"
            entryPoints: [websecure]
            service: inkadra-collab
            tls:
              certResolver: "${TRAEFIK_CERTRESOLVER-letsencrypt}"
        services:
          inkadra-collab:
            loadBalancer:
              servers:
                - url: http://collab:3001
