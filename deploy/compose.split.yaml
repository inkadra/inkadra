# Split mode: web, collab and worker as separate containers, for larger installs.
# Use together with compose.yaml:
#   docker compose -f compose.yaml -f deploy/compose.split.yaml up -d
# The proxy routes /collab to the `collab` service (port 3001) and everything else to `inkadra`.

services:
  inkadra:
    command: web

  collab:
    image: ghcr.io/inkadra/inkadra:${INKADRA_TAG:-latest}
    command: collab
    init: true
    restart: unless-stopped
    ports:
      - "${INKADRA_COLLAB_PORT:-3001}:3001"
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgres://inkadra:${POSTGRES_PASSWORD}@postgres:5432/inkadra
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    depends_on:
      inkadra:
        condition: service_healthy

  worker:
    image: ghcr.io/inkadra/inkadra:${INKADRA_TAG:-latest}
    command: worker
    init: true
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgres://inkadra:${POSTGRES_PASSWORD}@postgres:5432/inkadra
      REDIS_URL: redis://valkey:6379
    volumes:
      - inkadra-data:/data
    healthcheck:
      disable: true
    depends_on:
      inkadra:
        condition: service_healthy
