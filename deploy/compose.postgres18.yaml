# PostgreSQL 18, which compose.yaml ran up to Inkadra 0.11, on the same volume and layout (the cluster
# in 18/docker inside `postgres-data` or your POSTGRES_DATA folder). For staying on 18 for now
# (see docs/self-hosting/upgrades.md#staying-on-postgresql-18-for-now), and for going back to
# it if the move to 19 has to be undone:
#
#   docker compose -f compose.yaml -f deploy/compose.postgres18.yaml up -d
#
# Supported for one more release, like PostgreSQL 16 was after the move to 18.

services:
  postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
